ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // Target 36 (Play requires it as of Nov 2026). Android 16 ignores the
    // edge-to-edge opt-out, so the values-v35 opt-out theme was removed to keep
    // Android 15 on the same path. We handle insets the Capacitor-8 way: SystemBars
    // insetsHandling (capacitor.config.json) + EdgeToEdge.enable() in
    // MainActivity, with the FE's existing env(safe-area-inset-*) CSS +
    // viewport-fit=cover doing the padding. See docs: capacitorjs.com/docs/apis/system-bars.
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}