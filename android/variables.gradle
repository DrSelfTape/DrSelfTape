ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    // Target 35 (not 36) so the Android-15 edge-to-edge opt-out below actually
    // applies — apps targeting 36 cannot opt out and would force edge-to-edge,
    // which our WebView layout hasn't been device-verified against yet. 35 is
    // still Play-compliant (>= the required min). Revisit with a real Android
    // 15/16 device to support true edge-to-edge, then bump back to 36.
    targetSdkVersion = 35
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}