<!doctype html>
<!-- data-theme="light" pre-hydration: the app is light-only (theme.jsx pins
     it on mount) but the first painted frame used to resolve the dark :root
     defaults — a dark flash on every cold start. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />

    <title>Dr Self Tape — The Professional Self-Tape Studio for Actors</title>
    <meta name="description" content="AI-powered self-tape studio built for actors. Acting coach, live study mode, audition tracking, and professional recording tools — all in one place." />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dr Self Tape" />
    <meta name="theme-color" content="#FAFAF7" />

    <!-- Apple Splash Screens (iPhone) -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/icons/icon-512x512.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="/icons/icon-512x512.png" />

    <!-- Open Graph (Facebook, Instagram, iMessage, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://drselftape.app" />
    <meta property="og:title" content="Dr Self Tape — The Professional Self-Tape Studio for Actors" />
    <meta property="og:description" content="AI casting director simulation, live rehearsals, scene generator, and audition tracking. Built for actors who are serious about booking." />
    <meta property="og:image" content="https://drselftape.app/og-image.jpg" />
    <meta property="og:image:width" content="1080" />
    <meta property="og:image:height" content="771" />
    <meta property="og:site_name" content="Dr Self Tape" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://drselftape.app" />
    <meta name="twitter:title" content="Dr Self Tape — The Professional Self-Tape Studio for Actors" />
    <meta name="twitter:description" content="AI casting director simulation, live rehearsals, scene generator, and audition tracking. Built for actors who are serious about booking." />
    <meta name="twitter:image" content="https://drselftape.app/og-image.jpg" />

    <!-- One consolidated font pipeline (Ring 0): replaces the App.css @imports
         and LoginPage's injected links. Playfair stays for the mobile shell;
         Instrument Serif is the web console display face. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Grotesk:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

    <!-- Meta Pixel (Joseph Harold's Pixel) — web conversion tracking for ads.
         Native apps don't run this; firing happens via src/utils/analytics.js. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      try {
        // Only initialise on the web — Capacitor native apps shouldn't run the
        // browser pixel (no ATT, and installs are tracked via the store).
        if (!window.Capacitor || !window.Capacitor.isNativePlatform || !window.Capacitor.isNativePlatform()) {
          fbq('init', '388797831681495');
          fbq('track', 'PageView');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
